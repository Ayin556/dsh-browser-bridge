<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2-c 设备外壳观感 · fixture</title>
<style>
  /* 复刻 lib/client.cjs applyChrome mobile 分支的 P2-c 外壳样式：
     parent 画布 = #2a2a2e + padding 8px；webview 元素 = 圆角20 + 黑边7 + 阴影 + 居中 margin 24px auto */
  html, body { margin: 0; height: 100%; background: #2a2a2e; }
  .panel {
    box-sizing: border-box;
    height: 100%;
    background: #2a2a2e;
    padding: 8px;
    overflow: auto;
  }
  .device {
    display: block;
    width: 390px;
    max-width: 390px;
    min-width: 390px;
    flex: 0 0 390px;
    border-radius: 20px;
    border: 7px solid #1b1b1f;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
    background: #fff;
    margin: 24px auto;
    height: 600px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .device .screen {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #eef4ff, #dbe6ff);
    display: flex; align-items: center; justify-content: center;
    color: #335; font: 600 20px/1.4 -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="device">
      <div class="screen">
        390×844 手机视口<br>（设备外壳观感验证）
      </div>
    </div>
  </div>
</body>
</html>
